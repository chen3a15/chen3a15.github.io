<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chen3a15 · GitHub 公开数据</title>
<style>
:root {
  --bg:#f6f8fa; --card-bg:#fff; --text:#1f2328; --text-secondary:#656d76;
  --border:#d0d7de; --accent:#0969da; --accent-hover:#0550ae;
  --shadow:0 1px 3px rgba(0,0,0,.08); --shadow-hover:0 4px 12px rgba(0,0,0,.12);
  --radius:12px; --star-color:#e3b341; --lang-bg:#eaeef2; --lang-text:#1f2328;
  --skeleton-bg:#eaeef2; --skeleton-shine:#f6f8fa;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6; min-height:100vh;
}
.container { max-width:1100px; margin:0 auto; padding:24px 20px 60px; }

/* ===== 用户信息头部 ===== */
.profile-header {
  display:flex; align-items:center; gap:20px;
  background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius);
  padding:24px 28px; margin-bottom:20px; box-shadow:var(--shadow);
}
.profile-avatar { width:80px; height:80px; border-radius:50%; border:2px solid var(--border); flex-shrink:0; background:var(--skeleton-bg); }
.profile-info { flex:1; min-width:0; }
.profile-info h1 { font-size:1.5rem; font-weight:600; margin-bottom:4px; }
.profile-info h1 a { color:var(--text); text-decoration:none; }
.profile-info h1 a:hover { color:var(--accent); }
.profile-info .bio { color:var(--text-secondary); font-size:.925rem; margin-bottom:8px; }
.profile-stats { display:flex; gap:20px; flex-wrap:wrap; font-size:.9rem; color:var(--text-secondary); }
.profile-stats .num { font-weight:600; color:var(--text); }

/* ===== Tabs ===== */
.tabs {
  display:flex; gap:4px; border-bottom:1px solid var(--border);
  margin-bottom:20px; overflow-x:auto;
}
.tab-btn {
  padding:10px 18px; background:none; border:none;
  border-bottom:2px solid transparent; color:var(--text-secondary);
  font-size:.9rem; font-weight:500; cursor:pointer; white-space:nowrap;
  font-family:inherit; display:flex; align-items:center; gap:6px;
  transition:color .2s,border-color .2s;
}
.tab-btn:hover { color:var(--text); }
.tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }
.tab-count {
  background:var(--lang-bg); color:var(--text-secondary);
  font-size:.7rem; padding:1px 7px; border-radius:10px; font-weight:600;
}
.tab-btn.active .tab-count { background:var(--accent); color:#fff; }

/* ===== Panel ===== */
.tab-panel { display:none; }
.tab-panel.active { display:block; }

/* ===== 工具栏 ===== */
.toolbar { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
.search-box { flex:1; min-width:200px; position:relative; }
.search-box input {
  width:100%; padding:10px 14px 10px 38px;
  border:1px solid var(--border); border-radius:8px;
  background:var(--card-bg); color:var(--text); font-size:.9rem;
  outline:none; transition:border-color .2s,box-shadow .2s;
}
.search-box input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(9,105,218,.15); }
.search-box::before {
  content:"🔍"; position:absolute; left:12px; top:50%; transform:translateY(-50%);
  font-size:.9rem; opacity:.5; pointer-events:none;
}

/* ===== 自定义排序下拉框（美化箭头） ===== */
.select-wrapper {
  position:relative;
  display:inline-flex;
  align-items:center;
}
.sort-select {
  appearance:none;
  -webkit-appearance:none;
  -moz-appearance:none;
  padding:10px 38px 10px 14px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card-bg);
  color:var(--text);
  font-size:.9rem;
  font-family:inherit;
  outline:none;
  cursor:pointer;
  transition:border-color .2s,box-shadow .2s,background .2s;
  line-height:1.4;
}
.sort-select:hover {
  border-color:#b6bec7;
  background:#f9fafb;
}
.sort-select:focus {
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(9,105,218,.15);
}
/* 自定义箭头：CSS 画的下三角 + 上下分隔线，覆盖在右侧 */
.select-wrapper::after {
  content:"";
  position:absolute;
  right:14px;
  top:50%;
  width:8px;
  height:8px;
  transform:translateY(-75%) rotate(45deg);
  border-right:1.5px solid var(--text-secondary);
  border-bottom:1.5px solid var(--text-secondary);
  pointer-events:none;
  transition:border-color .2s;
}
.select-wrapper:hover::after {
  border-color:var(--text);
}
/* 让 select 自身的箭头在 Firefox 下也隐藏 */
.sort-select::-ms-expand { display:none; }

/* ===== 仓库卡片网格 ===== */
.repo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }
.repo-card {
  background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px 20px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px;
  transition:transform .2s,box-shadow .2s;
  animation:fadeInUp .35s ease both;
}
.repo-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-hover); }
@keyframes fadeInUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
.repo-card .repo-name { font-size:1.05rem; font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.repo-card .repo-name a { color:var(--accent); text-decoration:none; word-break:break-word; }
.repo-card .repo-name a:hover { text-decoration:underline; }
.repo-card .repo-owner { color:var(--text-secondary); font-weight:400; }
.repo-card .repo-desc {
  font-size:.875rem; color:var(--text-secondary); flex:1; min-height:1.4em;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.repo-card .repo-meta { display:flex; align-items:center; gap:16px; flex-wrap:wrap; font-size:.8rem; color:var(--text-secondary); margin-top:4px; }
.repo-card .repo-meta .meta-item { display:flex; align-items:center; gap:4px; }
.lang-dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex-shrink:0; }
.fork-badge {
  background:var(--lang-bg); color:var(--text-secondary);
  padding:2px 8px; border-radius:12px; font-size:.7rem; font-weight:500;
}
.star-icon { color:var(--star-color); }

/* ===== 用户卡片（关注/粉丝） ===== */
.user-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
.user-card {
  display:flex; align-items:center; gap:12px;
  background:var(--card-bg); border:1px solid var(--border);
  border-radius:var(--radius); padding:14px 16px;
  text-decoration:none; color:var(--text);
  box-shadow:var(--shadow);
  transition:transform .2s,box-shadow .2s;
  animation:fadeInUp .35s ease both;
}
.user-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-hover); }
.user-card img {
  width:44px; height:44px; border-radius:50%;
  background:var(--skeleton-bg); flex-shrink:0; border:1px solid var(--border);
}
.user-card .u-info { min-width:0; flex:1; }
.user-card .u-name { font-weight:600; font-size:.9rem; word-break:break-word; color:var(--accent); }
.user-card .u-type { font-size:.75rem; color:var(--text-secondary); }

/* ===== 骨架屏 ===== */
.skeleton-card {
  background:var(--card-bg); border:1px solid var(--border);
  border-radius:var(--radius); padding:18px 20px;
  display:flex; flex-direction:column; gap:12px;
}
.skeleton-user {
  background:var(--card-bg); border:1px solid var(--border);
  border-radius:var(--radius); padding:14px 16px;
  display:flex; align-items:center; gap:12px;
}
.skeleton-avatar {
  width:44px; height:44px; border-radius:50%;
  background:linear-gradient(90deg,var(--skeleton-bg) 25%,var(--skeleton-shine) 50%,var(--skeleton-bg) 75%);
  background-size:200% 100%; animation:shimmer 1.5s infinite; flex-shrink:0;
}
.skeleton-line {
  height:14px; border-radius:6px;
  background:linear-gradient(90deg,var(--skeleton-bg) 25%,var(--skeleton-shine) 50%,var(--skeleton-bg) 75%);
  background-size:200% 100%; animation:shimmer 1.5s infinite;
}
.skeleton-line.w60 { width:60%; }
.skeleton-line.w90 { width:90%; }
.skeleton-line.w40 { width:40%; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ===== 状态提示 ===== */
.status-box { text-align:center; padding:60px 20px; color:var(--text-secondary); grid-column:1/-1; }
.status-box .icon { font-size:3rem; margin-bottom:12px; }
.status-box p { font-size:1rem; margin-bottom:8px; }
.status-box .hint { font-size:.85rem; opacity:.8; }
.btn-retry {
  margin-top:16px; padding:10px 24px; background:var(--accent); color:#fff;
  border:none; border-radius:8px; font-size:.9rem; font-weight:500;
  cursor:pointer; transition:background .2s;
}
.btn-retry:hover { background:var(--accent-hover); }

/* ===== 分页 ===== */
.pagination { display:flex; justify-content:center; align-items:center; gap:8px; margin-top:28px; flex-wrap:wrap; }
.pagination button {
  padding:8px 16px; border:1px solid var(--border); border-radius:8px;
  background:var(--card-bg); color:var(--text); font-size:.875rem;
  cursor:pointer; transition:background .2s,border-color .2s,color .2s;
}
.pagination button:hover:not(:disabled) { background:var(--accent); color:#fff; border-color:var(--accent); }
.pagination button:disabled { opacity:.4; cursor:not-allowed; }
.pagination .page-info { font-size:.875rem; color:var(--text-secondary); padding:0 8px; }

/* ===== 响应式 ===== */
@media (max-width:600px) {
  .profile-header { flex-direction:column; text-align:center; padding:20px 16px; }
  .profile-stats { justify-content:center; }
  .toolbar { flex-direction:column; }
  .search-box { min-width:100%; }
  .select-wrapper { width:100%; }
  .sort-select { width:100%; }
  .repo-grid, .user-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<div class="container">

  <!-- 用户信息 -->
  <header class="profile-header">
    <img class="profile-avatar" id="avatar" src="" alt="avatar" loading="lazy">
    <div class="profile-info">
      <h1><a href="https://github.com/chen3a15" target="_blank" rel="noopener" id="userName">chen3a15</a></h1>
      <div class="bio" id="userBio"></div>
      <div class="profile-stats">
        <span>📦 <span class="num" id="repoCount">-</span> 仓库</span>
        <span>🔗 <span class="num" id="followingCount">-</span> 关注</span>
        <span>👥 <span class="num" id="followerCount">-</span> 粉丝</span>
      </div>
    </div>
  </header>

  <!-- Tabs: 仓库 → Star → 关注 → 粉丝 -->
  <nav class="tabs">
    <button class="tab-btn active" data-tab="repos">📦 仓库 <span class="tab-count" data-count="repos"></span></button>
    <button class="tab-btn" data-tab="starred">⭐ Star <span class="tab-count" data-count="starred"></span></button>

  <!-- Panel: 仓库 -->

  </div>

  <!-- Panel: Star -->
  <div class="tab-panel" data-panel="starred">
    <div class="toolbar">
      <div class="search-box">
        <input type="text" data-search placeholder="搜索仓库名称或描述..." autocomplete="off">
      </div>
      <div class="select-wrapper">
        <select class="sort-select" data-sort>
          <option value="updated">最近更新</option>
          <option value="created">创建时间</option>
          <option value="pushed">最近推送</option>
          <option value="full_name">名称 A→Z</option>
          <option value="stars">⭐ 星标数</option>
        </select>
      </div>
    </div>
    <div class="repo-grid" data-grid></div>
    <div class="pagination" data-pagination style="display:none;">
      <button data-prev disabled>← 上一页</button>
      <span class="page-info" data-page-info></span>
      <button data-next disabled>下一页 →</button>
    </div>
  </div>

  <!-- Panel: 关注 -->
  <div class="tab-panel" data-panel="following">
    <div class="toolbar">
      <div class="search-box">
        <input type="text" data-search placeholder="搜索用户名..." autocomplete="off">
      </div>
      <div class="select-wrapper">
        <select class="sort-select" data-sort>
          <option value="login_asc">用户名 A→Z</option>
          <option value="login_desc">用户名 Z→A</option>
        </select>

    </div>
    <div class="user-grid" data-grid></div>
    <div class="pagination" data-pagination style="display:none;">
      <button data-prev disabled>← 上一页</button>
      <span class="page-info" data-page-info></span>
      <button data-next disabled>下一页 →</button>
    </div>
  </div>

  <!-- Panel: 粉丝 -->
  <div class="tab-panel" data-panel="followers">
    <div class="toolbar">
      <div class="search-box">
        <input type="text" data-search placeholder="搜索用户名..." autocomplete="off">
      </div>
      <div class="select-wrapper">
        <select class="sort-select" data-sort>
          <option value="login_asc">用户名 A→Z</option>
          <option value="login_desc">用户名 Z→A</option>
        </select>
      </div>
    </div>
    <div class="user-grid" data-grid></div>
    <div class="pagination" data-pagination style="display:none;">
      <button data-prev disabled>← 上一页</button>
      <span class="page-info" data-page-info></span>
      <button data-next disabled>下一页 →</button>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  const USERNAME = 'chen3a15';
  const API_BASE = 'https://api.github.com';
  const PER_PAGE = 30;

  const LANG_COLORS = {
    JavaScript:'#f1e05a', TypeScript:'#3178c6', Python:'#3572A5',
    Java:'#b07219', 'C++':'#f34b7d', C:'#555555', 'C#':'#178600',
    Go:'#00ADD8', Rust:'#dea584', Ruby:'#701516', PHP:'#4F5D95',
    Swift:'#F05138', Kotlin:'#A97BFF', Dart:'#00B4AB', HTML:'#e34c26',
    CSS:'#563d7c', SCSS:'#c6538c', Shell:'#89e051', Vue:'#41b883',
    Svelte:'#ff3e00', Lua:'#000080', Perl:'#0298c3', R:'#198CE7',
    Scala:'#c22d40', Elixir:'#6e4a7e', Haskell:'#5e5086',
    Assembly:'#6E4C13', Dockerfile:'#384d54', Makefile:'#427819',
    CMake:'#DA3434', Zig:'#ec915c', Nix:'#7e7eff',
    Vim_Script:'#199f4b', PowerShell:'#012456', TeX:'#3D6117',
  };
  const DEFAULT_LANG_COLOR = '#8b949e';

  const $ = id => document.getElementById(id);
  const els = {
    avatar: $('avatar'), userName: $('userName'), userBio: $('userBio'),
    repoCount: $('repoCount'), followerCount: $('followerCount'),
    followingCount: $('followingCount'),
  };

  // ---------- 状态 ----------
  const state = {
    repos:     { data:[], filtered:[], page:1, loaded:false, loading:false, error:null,
                 search:'', sort:'updated',
                 url: `${API_BASE}/users/${USERNAME}/repos?per_page=100&sort=updated` },
    starred:   { data:[], filtered:[], page:1, loaded:false, loading:false, error:null,
                 search:'', sort:'updated',
                 url: `${API_BASE}/users/${USERNAME}/starred?per_page=100&sort=updated` },
    following: { data:[], filtered:[], page:1, loaded:false, loading:false, error:null,
                 search:'', sort:'login_asc',
                 url: `${API_BASE}/users/${USERNAME}/following?per_page=100` },
    followers: { data:[], filtered:[], page:1, loaded:false, loading:false, error:null,
                 search:'', sort:'login_asc',
                 url: `${API_BASE}/users/${USERNAME}/followers?per_page=100` },
  };

  const panels = {};
  document.querySelectorAll('.tab-panel').forEach(panel => {
    const key = panel.dataset.panel;
    panels[key] = {
      root: panel,
      search: panel.querySelector('[data-search]'),
      sort: panel.querySelector('[data-sort]'),
      grid: panel.querySelector('[data-grid]'),
      pagination: panel.querySelector('[data-pagination]'),
      prev: panel.querySelector('[data-prev]'),
      next: panel.querySelector('[data-next]'),
      pageInfo: panel.querySelector('[data-page-info]'),
    };
  });

  // ---------- 工具 ----------
  function formatCount(n) {
    if (n == null) return '0';
    if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
    if (n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'') + 'k';
    return String(n);
  }
  function timeAgo(dateStr) {
    const date = new Date(dateStr), now = new Date();
    const diff = Math.floor((now - date) / 1000);
    if (diff < 60)       return '刚刚';
    if (diff < 3600)     return Math.floor(diff/60) + ' 分钟前';
    if (diff < 86400)    return Math.floor(diff/3600) + ' 小时前';
    if (diff < 2592000)  return Math.floor(diff/86400) + ' 天前';
    if (diff < 31536000) return Math.floor(diff/2592000) + ' 个月前';
    return Math.floor(diff/31536000) + ' 年前';
  }
  function getLangColor(lang) {
    if (!lang) return DEFAULT_LANG_COLOR;
    const key = lang.replace(/[^a-zA-Z0-9#+]/g, '_');
    return LANG_COLORS[key] || DEFAULT_LANG_COLOR;
  }
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  async function fetchJSON(url) {
    const res = await fetch(url);
    if (!res.ok) {
      const err = new Error(`HTTP ${res.status}`);
      err.status = res.status;
      throw err;
    }
    return res.json();
  }
  function errorMessage(err) {
    if (err && err.status === 404) return '资源不存在或未公开';
    if (err && (err.status === 403 || err.status === 429)) return 'API 请求频率超限，请稍后重试';
    return '加载失败，请检查网络连接';
  }

  // ---------- 骨架屏 ----------
  function showSkeleton(gridEl, count, kind) {
    gridEl.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      if (kind === 'user') {
        el.className = 'skeleton-user';
        el.innerHTML = `
          <div class="skeleton-avatar"></div>
          <div style="flex:1;display:flex;flex-direction:column;gap:8px;">
            <div class="skeleton-line w60"></div>
            <div class="skeleton-line w40"></div>
          </div>`;
      } else {
        el.className = 'skeleton-card';
        el.innerHTML = `
          <div class="skeleton-line w60"></div>
          <div class="skeleton-line w90"></div>
          <div class="skeleton-line w40"></div>`;
      }
      gridEl.appendChild(el);
    }
  }

  // ---------- 状态提示 ----------
  function showStatus(panel, icon, message, hint, showRetry, tabKey) {
    panel.grid.innerHTML = `
      <div class="status-box">
        <div class="icon">${icon}</div>
        <p>${escapeHtml(message)}</p>
        ${hint ? `<p class="hint">${escapeHtml(hint)}</p>` : ''}
        ${showRetry ? '<button class="btn-retry">重新加载</button>' : ''}
      </div>`;
    panel.pagination.style.display = 'none';
    if (showRetry) {
      panel.grid.querySelector('.btn-retry').addEventListener('click', () => {
        state[tabKey].loaded = false;
        state[tabKey].error = null;
        ensureLoaded(tabKey, true);
      });
    }
  }

  // ---------- 卡片 HTML ----------
  function repoCardHtml(repo, opts) {
    const showOwner = opts && opts.showOwner;
    const name = escapeHtml(repo.name);
    const owner = repo.owner ? escapeHtml(repo.owner.login) : '';
    const desc = repo.description ? escapeHtml(repo.description) : '';
    const htmlUrl = escapeHtml(repo.html_url);
    const lang = repo.language || '';
    const langColor = getLangColor(lang);
    const stars = formatCount(repo.stargazers_count);
    const forks = formatCount(repo.forks_count);
    const updated = timeAgo(repo.updated_at);
    const isFork = repo.fork;

    const nameHtml = showOwner && owner
      ? `<span class="repo-owner">${owner}/</span><a href="${htmlUrl}" target="_blank" rel="noopener">${name}</a>`
      : `<a href="${htmlUrl}" target="_blank" rel="noopener">${name}</a>`;

    return `
      <div class="repo-name">
        ${nameHtml}
        ${isFork ? '<span class="fork-badge">Fork</span>' : ''}
      </div>
      ${desc
        ? `<div class="repo-desc">${desc}</div>`
        : '<div class="repo-desc" style="opacity:.5;">暂无描述</div>'}
      <div class="repo-meta">
        ${lang ? `<span class="meta-item">
          <span class="lang-dot" style="background:${langColor};"></span>${escapeHtml(lang)}
        </span>` : ''}
        <span class="meta-item"><span class="star-icon">★</span> ${stars}</span>
        <span class="meta-item">🍴 ${forks}</span>
        <span class="meta-item">🕒 ${updated}</span>
      </div>`;
  }

  function userCardHtml(user) {
    const login = escapeHtml(user.login);
    const url = escapeHtml(user.html_url);
    const avatar = escapeHtml(user.avatar_url);
    const type = user.type === 'Organization' ? '组织' : '用户';
    return `
      <a class="user-card" href="${url}" target="_blank" rel="noopener">
        <img src="${avatar}" alt="${login}" loading="lazy">
        <div class="u-info">
          <div class="u-name">${login}</div>
          <div class="u-type">${type}</div>
        </div>
      </a>`;
  }

  // ---------- 过滤 + 排序 ----------
  function applyFilterSort(tabKey) {
    const s = state[tabKey];
    const keyword = s.search.trim().toLowerCase();
    const isUserTab = (tabKey === 'following' || tabKey === 'followers');

    if (keyword) {
      s.filtered = s.data.filter(item => {
        if (isUserTab) return (item.login || '').toLowerCase().includes(keyword);
        const name = (item.name || '').toLowerCase();
        const desc = (item.description || '').toLowerCase();
        const owner = (item.owner && item.owner.login || '').toLowerCase();
        return name.includes(keyword) || desc.includes(keyword) || owner.includes(keyword);
      });
    } else {
      s.filtered = s.data.slice();
    }

    switch (s.sort) {
      case 'updated':    s.filtered.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at)); break;
      case 'created':    s.filtered.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)); break;
      case 'pushed':     s.filtered.sort((a,b)=>new Date(b.pushed_at)-new Date(a.pushed_at)); break;
      case 'full_name':  s.filtered.sort((a,b)=>(a.name||'').localeCompare(b.name||'')); break;
      case 'stars':      s.filtered.sort((a,b)=>(b.stargazers_count||0)-(a.stargazers_count||0)); break;
      case 'login_asc':  s.filtered.sort((a,b)=>(a.login||'').localeCompare(b.login||'')); break;
      case 'login_desc': s.filtered.sort((a,b)=>(b.login||'').localeCompare(a.login||'')); break;
    }

    s.page = 1;
    renderTab(tabKey);
  }

  // ---------- 渲染 Tab ----------
  function renderTab(tabKey) {
    const s = state[tabKey];
    const panel = panels[tabKey];
    const isUserTab = (tabKey === 'following' || tabKey === 'followers');

    if (s.loading && !s.loaded) {
      showSkeleton(panel.grid, isUserTab ? 8 : 6, isUserTab ? 'user' : 'repo');
      panel.pagination.style.display = 'none';
      return;
    }
    if (s.error) { showStatus(panel, '⚠️', errorMessage(s.error), '', true, tabKey); return; }
    if (!s.loaded) {
      showSkeleton(panel.grid, isUserTab ? 8 : 6, isUserTab ? 'user' : 'repo');
      panel.pagination.style.display = 'none';
      return;
    }

    if (s.filtered.length === 0) {
      const searching = s.search.trim() !== '';
      let icon, msg;
      if (searching) { icon = '🔍'; msg = '没有找到匹配结果'; }
      else if (tabKey === 'following') { icon = '🔗'; msg = '该用户没有公开关注的人'; }
      else if (tabKey === 'followers') { icon = '👥'; msg = '该用户没有公开粉丝'; }
      else if (tabKey === 'starred')   { icon = '⭐'; msg = '没有公开的 Star 仓库'; }
      else { icon = '📭'; msg = '该用户暂无公开仓库'; }
      showStatus(panel, icon, msg, searching ? '试试其他关键词' : '', false, tabKey);
      return;
    }

    const totalPages = Math.max(1, Math.ceil(s.filtered.length / PER_PAGE));
    if (s.page > totalPages) s.page = totalPages;
    const start = (s.page - 1) * PER_PAGE;
    const pageItems = s.filtered.slice(start, start + PER_PAGE);

    panel.grid.innerHTML = '';
    pageItems.forEach((item, i) => {
      if (isUserTab) {
        const tmp = document.createElement('div');
        tmp.innerHTML = userCardHtml(item);
        const node = tmp.firstElementChild;
        node.style.animationDelay = (i * 0.03) + 's';
        panel.grid.appendChild(node);
      } else {
        const el = document.createElement('div');
        el.className = 'repo-card';
        el.style.animationDelay = (i * 0.04) + 's';
        el.innerHTML = repoCardHtml(item, { showOwner: tabKey === 'starred' });
        panel.grid.appendChild(el);
      }
    });

    if (totalPages > 1) {
      panel.pagination.style.display = 'flex';
      panel.pageInfo.textContent = `第 ${s.page} 页 / 共 ${totalPages} 页`;
      panel.prev.disabled = s.page <= 1;
      panel.next.disabled = s.page >= totalPages;
    } else {
      panel.pagination.style.display = 'none';
    }
  }

  function updateCount(tabKey) {
    const el = document.querySelector(`[data-count="${tabKey}"]`);
    if (!el) return;
    const s = state[tabKey];
    if (s.loaded) el.textContent = s.data.length;
  }

  // ---------- 懒加载 ----------
  async function ensureLoaded(tabKey, force) {
    const s = state[tabKey];
    if (!force && (s.loaded || s.loading)) {
      if (s.loaded) renderTab(tabKey);
      return;
    }
    s.loading = true;
    s.error = null;
    renderTab(tabKey);

    try {
      const data = await fetchJSON(s.url);
      s.data = Array.isArray(data) ? data : [];
      s.loaded = true;
      updateCount(tabKey);
      applyFilterSort(tabKey);
    } catch (err) {
      console.error(`加载 ${tabKey} 失败:`, err);
      s.error = err;
      renderTab(tabKey);
    } finally {
      s.loading = false;
    }
  }

  // ---------- 用户信息 ----------
  async function loadUserInfo() {
    try {
      const user = await fetchJSON(`${API_BASE}/users/${USERNAME}`);
      els.avatar.src = user.avatar_url || '';
      els.avatar.alt = user.login || 'avatar';
      els.userName.textContent = user.login || USERNAME;
      els.userName.href = user.html_url || `https://github.com/${USERNAME}`;
      els.userBio.textContent = user.bio || '';
      els.repoCount.textContent = user.public_repos ?? '-';
      els.followingCount.textContent = formatCount(user.following);
      els.followerCount.textContent = formatCount(user.followers);
    } catch (err) {
      console.error('加载用户信息失败:', err);
    }
  }

  // ---------- Tab 切换 ----------
  function activateTab(tabKey) {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tabKey);
    });
    document.querySelectorAll('.tab-panel').forEach(p => {
      p.classList.toggle('active', p.dataset.panel === tabKey);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
    ensureLoaded(tabKey, false);
  }

  // ---------- 事件绑定 ----------
  function bindEvents() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => activateTab(btn.dataset.tab));
    });

    Object.keys(panels).forEach(tabKey => {
      const panel = panels[tabKey];
      const s = state[tabKey];

      let timer;
      panel.search.addEventListener('input', () => {
        s.search = panel.search.value;
        clearTimeout(timer);
        timer = setTimeout(() => applyFilterSort(tabKey), 250);
      });

      panel.sort.addEventListener('change', () => {
        s.sort = panel.sort.value;
        applyFilterSort(tabKey);
      });

      panel.prev.addEventListener('click', () => {
        if (s.page > 1) { s.page--; renderTab(tabKey); window.scrollTo({top:0,behavior:'smooth'}); }
      });
      panel.next.addEventListener('click', () => {
        const totalPages = Math.max(1, Math.ceil(s.filtered.length / PER_PAGE));
        if (s.page < totalPages) { s.page++; renderTab(tabKey); window.scrollTo({top:0,behavior:'smooth'}); }
      });
    });
  }

  // ---------- 初始化 ----------
  function init() {
    bindEvents();
    loadUserInfo();
    ensureLoaded('repos', false);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
